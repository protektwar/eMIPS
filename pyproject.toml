[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emips"
version = "2.0.0"
description = "A MIPS32 teaching emulator: assembler, disassembler, every release R1-R6, CP0, FPU, caches, TLBs, the 5-stage and 24K pipelines, multi-core, EJTAG"
readme = "README.md"
requires-python = ">=3.10"
# The core library has no runtime dependencies.
dependencies = []
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Alexandru Herlas", email = "45262264+protektwar@users.noreply.github.com" }]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: System :: Emulators",
]

[project.urls]
Homepage = "https://github.com/protektwar/eMIPS"
Guide = "https://github.com/protektwar/eMIPS/blob/main/docs/guide/index.html"

[project.optional-dependencies]
diagrams = ["Pillow>=10"]
# graphical front end (emips/gui; PySide6 also works)
gui = ["PyQt6>=6.4"]

[project.scripts]
emips = "emips.__main__:main"
emips-gui = "emips.gui.main:main"

[tool.setuptools.packages.find]
include = ["emips*"]

[tool.setuptools.package-data]
"emips" = ["data/*.json", "data/*.dat", "gui/examples/*.asm", "gui/translations/*.ts",
            "c/*.S", "c/*.c", "c/*.h", "c/*.ld"]
